<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARCHÉ LIBRE - Plateforme B2B & Commerce Général</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- En-tête principal -->
    <header class="main-header">
        <div class="logo-container">
            <h1><i class="fa-solid fa-store"></i> MARCHÉ <span>LIBRE</span></h1>
            <p class="tagline">Plateforme de Commerce Général, Gros & Courtage</p>
        </div>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Rechercher des articles, parcelles, équipements...">
            <button id="searchBtn"><i class="fa-solid fa-search"></i></button>
        </div>
        <div class="header-actions">
            <button id="openAddModalBtn" class="btn-primary"><i class="fa-solid fa-plus"></i> Publier une offre</button>
        </div>
    </header>

    <!-- Barre de catégories -->
    <nav class="categories-nav">
        <button class="cat-btn active" data-cat="all">Toutes les catégories</button>
        <button class="cat-btn" data-cat="gros">Vente en Gros & Détail</button>
        <button class="cat-btn" data-cat="immobilier">Immobilier & Parcelles</button>
        <button class="cat-btn" data-cat="materiel">Équipements & Matériel</button>
        <button class="cat-btn" data-cat="agriculture">Agriculture & Produit locaux</button>
    </nav>

    <!-- Contenu Principal -->
    <main class="container">
        <section class="hero-banner">
            <h2>Bienvenue sur MARCHÉ LIBRE</h2>
            <p>La référence pour vos achats, ventes en gros, opportunités immobilières et négociation directe via WhatsApp.</p>
        </section>

        <!-- Grille des offres -->
        <div id="productsGrid" class="products-grid">
            <!-- Les offres s'affichent dynamiquement ici -->
        </div>
    </main>

    <!-- Modal pour ajouter une nouvelle offre -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Publier une offre sur MARCHÉ LIBRE</h2>
            <form id="productForm">
                <input type="text" id="prodTitle" placeholder="Nom de l'article ou titre de l'annonce" required>
                <select id="prodCategory" required>
                    <option value="gros">Vente en Gros & Détail</option>
                    <option value="immobilier">Immobilier & Parcelles</option>
                    <option value="materiel">Équipements & Matériel</option>
                    <option value="agriculture">Agriculture & Produit locaux</option>
                </select>
                <input type="text" id="prodPrice" placeholder="Prix (ex: 50$ / sac ou Négociable)" required>
                <input type="text" id="prodMoq" placeholder="Quantité / Conditionnement (ex: Min. 10 pièces ou 1 parcelle)" required>
                <textarea id="prodDesc" placeholder="Description détaillée de l'offre ou caractéristiques..." required></textarea>
                <input type="text" id="prodImage" placeholder="Lien de l'image (URL) - Optionnel">
                <input type="text" id="prodContact" placeholder="Numéro WhatsApp (ex: +243...)" required>
                <button type="submit" class="btn-submit">Mettre en ligne sur MARCHÉ LIBRE</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <strong>MARCHÉ LIBRE</strong>. Tous droits réservés.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>

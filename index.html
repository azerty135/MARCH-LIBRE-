<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARCHÉ LIBRE - Plateforme B2B & Commerce Général</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- En-tête supérieur style Alibaba -->
    <header class="alibaba-header">
        <div class="header-top">
            <div class="logo-area">
                <i class="fa-solid fa-store logo-icon"></i>
                <span class="logo-title">MARCHÉ <span>LIBRE</span></span>
            </div>
            <button id="openAddModalBtn" class="btn-publish"><i class="fa-solid fa-plus"></i> Publier une annonce</button>
        </div>

        <!-- Barre de recherche avancée -->
        <div class="search-container">
            <div class="search-box">
                <i class="fa-solid fa-search search-icon"></i>
                <input type="text" id="searchInput" placeholder="Ex: ciment, parcelle à vendre, friperie, matériel...">
                <button id="searchBtn" class="search-submit"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
        </div>
    </header>

    <!-- Navigation par onglets de catégories -->
    <nav class="tabs-nav">
        <button class="tab-btn active" data-cat="all"><i class="fa-solid fa-border-all"></i> Tout</button>
        <button class="tab-btn" data-cat="gros"><i class="fa-solid fa-box-open"></i> Gros & Détail</button>
        <button class="tab-btn" data-cat="immobilier"><i class="fa-solid fa-building"></i> Immobilier</button>
        <button class="tab-btn" data-cat="materiel"><i class="fa-solid fa-tools"></i> Équipements</button>
        <button class="tab-btn" data-cat="agriculture"><i class="fa-solid fa-seedling"></i> Agriculture</button>
    </nav>

    <!-- Contenu Principal / Grille des produits -->
    <main class="main-container">
        <div class="results-info">
            <h2 id="sectionTitle">À découvrir</h2>
            <span id="countBadge">8 annonces</span>
        </div>

        <div id="productsGrid" class="products-grid">
            <!-- Les cartes de produits s'injectent dynamiquement ici -->
        </div>
    </main>

    <!-- Pied de page avec accès admin discret -->
    <footer class="main-footer">
        <p>&copy; 2026 MARCHÉ LIBRE. Tous droits réservés.</p>
        <button id="adminLoginBtn" class="admin-link-btn"><i class="fa-solid fa-lock"></i> Espace Administrateur</button>
    </footer>

    <!-- Barre de navigation inférieure mobile -->
    <div class="mobile-bottom-nav">
        <button class="nav-item active" onclick="window.scrollTo({top:0, behavior:'smooth'})">
            <i class="fa-solid fa-house"></i>
            <span>Accueil</span>
        </button>
        <button class="nav-item" onclick="document.getElementById('openAddModalBtn').click()">
            <i class="fa-solid fa-circle-plus" style="font-size: 24px; color: var(--primary-color);"></i>
            <span>Publier</span>
        </button>
        <button class="nav-item" onclick="document.getElementById('adminLoginBtn').click()">
            <i class="fa-solid fa-shield-halved"></i>
            <span>Admin</span>
        </button>
    </div>

    <!-- Modal de publication d'annonce -->
    <div id="addProductModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <h2>Publier une offre sur MARCHÉ LIBRE</h2>
            <form id="productForm">
                <input type="text" id="prodTitle" placeholder="Titre de l'offre (ex: Sacs de maïs 25kg)" required>
                <select id="prodCategory" required>
                    <option value="gros">Gros & Détail</option>
                    <option value="immobilier">Immobilier & Parcelles</option>
                    <option value="materiel">Équipements & Matériel</option>
                    <option value="agriculture">Agriculture & Intrants</option>
                </select>
                <input type="text" id="prodPrice" placeholder="Prix (ex: $450 ou FC 85 000)" required>
                <input type="text" id="prodMoq" placeholder="Condition / MOQ (ex: Min. 10 sacs ou Négociable)" required>
                <input type="text" id="prodLocation" placeholder="Lieu (ex: Lubumbashi, Centre-ville)" required>
                <textarea id="prodDesc" placeholder="Description détaillée..." required></textarea>
                <input type="text" id="prodImage" placeholder="Lien de l'image (URL) - Optionnel">
                <input type="text" id="prodContact" placeholder="Numéro WhatsApp (ex: +243...)" required>
                <button type="submit" class="btn-submit">Mettre en ligne</button>
            </form>
        </div>
    </div>

    <!-- Modal Panneau d'Administration (Secret & Protégé) -->
    <div id="adminModal" class="modal">
        <div class="modal-content admin-modal-content">
            <span class="close-btn" onclick="closeModals()">&times;</span>
            <h2><i class="fa-solid fa-gauge-high"></i> Contrôle Administratif</h2>
            <div id="adminBody">
                <!-- S'affiche si non connecté -->
                <div id="adminAuthSection">
                    <p style="font-size: 13px; color: #64748b; margin-bottom: 12px;">Entrez le mot de passe administrateur pour gérer les publications.</p>
                    <input type="password" id="adminPasswordInput" placeholder="Mot de passe admin">
                    <button id="adminLoginSubmit" class="btn-submit">Se connecter au contrôle</button>
                </div>
                <!-- S'affiche une fois connecté -->
                <div id="adminPanelSection" style="display: none;">
                    <div class="admin-stats-bar">
                        <span>Total annonces : <strong id="adminTotalCount">0</strong></span>
                        <button id="adminLogoutBtn" class="btn-logout">Déconnexion</button>
                    </div>
                    <div id="adminProductList" class="admin-product-list">
                        <!-- Liste des annonces avec boutons de suppression -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
